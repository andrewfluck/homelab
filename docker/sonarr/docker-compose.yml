version: "3.3"

services:
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
    volumes:
      - /docker/sonarr/data:/config
      - media:/media
      - media-downloads:/downloads
    ports:
      - 8989:8989
    networks:
      appliances:
        ipv4_address: 10.10.0.43
    restart: unless-stopped

networks:
  appliances:
    name: appliances
    external: true

volumes:
  media:
    name: media
    external: true
  media-downloads:
    name: media-downloads
    driver: local
    driver_opts:
      type: nfs
      o: addr=10.10.0.11,rw,nfsvers=3,nolock
      device: ":/volume/fbc954de-d34f-4385-aa6e-3ddd8e0ccd7e/.srv/.unifi-drive/media/.data/downloads"
