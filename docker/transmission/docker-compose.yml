version: "3.3"

services:
  transmission:
    image: lscr.io/linuxserver/transmission:latest
    container_name: transmission
    environment:
      - TZ=$TZ
    volumes:
      - /docker/transmission/data:/config
      - media:/media
      - media-downloads:/downloads
      - type: volume
        source: media
        target: /watch
        volume:
          subpath: watch
    networks:
      appliances:
        ipv4_address: 10.10.0.42
    restart: unless-stopped

networks:
  appliances:
    name: appliances
    external: true

volumes:
  media:
    name: media
    external: true
  media-downloads:
    name: media-downloads
    driver: local
    driver_opts:
      type: nfs
      o: addr=10.10.0.11,rw,nfsvers=3,nolock
      device: ":/volume/fbc954de-d34f-4385-aa6e-3ddd8e0ccd7e/.srv/.unifi-drive/media/.data/downloads"
